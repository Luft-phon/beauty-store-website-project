<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; line-height: 1.5; color: #444; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; border: 1px solid #eee; }
        .header { background-color: #947b5c; color: white; padding: 20px; text-align: center; }
        .header h2 { margin: 0; text-transform: uppercase; letter-spacing: 2px; font-size: 1.2em; }
        .content { padding: 30px; }
        .data-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .data-table td { padding: 12px; border-bottom: 1px solid #f9f9f9; }
        .label { font-weight: bold; color: #888; width: 120px; text-transform: uppercase; font-size: 0.75em; }
        .message-box { background-color: #fcfcfc; border: 1px solid #eee; padding: 15px; margin-top: 10px; font-style: italic; }
        .footer { background-color: #f9f9f9; padding: 15px; text-align: center; font-size: 0.8em; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2>New Website Inquiry</h2>
        </div>

        <div class="content">
            <p>You have received a new inquiry from the website. Here are the details:</p>
            
            <table class="data-table">
                <tr>
                    <td class="label">Name</td>
                    <td><strong>{{name}}</strong></td>
                </tr>
                <tr>
                    <td class="label">Email</td>
                    <td>{{email}}</td>
                </tr>
                <tr>
                    <td class="label">Phone</td>
                    <td>{{phone}}</td>
                </tr>
                <tr>
                    <td class="label">Service</td>
                    <td>{{serviceName}}</td>
                </tr>
                <tr>
                    <td class="label">Date</td>
                    <td>{{date}}</td>
                </tr>
                <tr>
                    <td class="label">Time</td>
                    <td>{{time}}</td>
                </tr>
                <tr>
                    <td class="label">Travel</td>
                    <td>{{travelfee}}</td>
                </tr>
            </table>

            <div class="label" style="margin-top: 20px;">Message:</div>
            <div class="message-box">
                {{message}}
            </div>
        </div>

        <div class="footer">
            Le Charme Beaute Boutique &bull; Automated Inquiry System
        </div>
    </div>
</body>
</html>
